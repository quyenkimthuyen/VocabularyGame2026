<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vocab Fun</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Main App Container -->
    <div id="app">
        <!-- Home Screen -->
        <div id="screen-home" class="screen active">
            <h1 class="bounce-loop text-white">Vocab Fun!</h1>

            <!-- Difficulty Selector -->
            <div class="difficulty-selector">
                <div class="difficulty-toggle">
                    <button class="diff-btn active" id="diff-easy" onclick="setDifficulty('easy')">Dễ 🟢</button>
                    <button class="diff-btn" id="diff-medium" onclick="setDifficulty('medium')">Vừa 🟡</button>
                    <button class="diff-btn" id="diff-hard" onclick="setDifficulty('hard')">Khó 🔴</button>
                </div>
            </div>

            <div class="category-grid">
                <button class="category-btn" style="background:#ffe4e1" onclick="startGame('Hello')">
                    <div class="emoji">👋</div>
                    <div class="label">Hello</div>
                    <div class="category-score">⭐ <span id="score-Hello">0</span></div>
                    <div class="category-lives" id="lives-Hello"></div>
                </button>
                <button class="category-btn" style="background:#fdffb6" onclick="startGame('MyWeek')">
                    <div class="emoji">📆🗓️</div>
                    <div class="label">My Week</div>
                    <div class="category-score">⭐ <span id="score-MyWeek">0</span></div>
                    <div class="category-lives" id="lives-MyWeek"></div>
                </button>
                <button class="category-btn" style="background:#caffbf" onclick="startGame('Home')">
                    <div class="emoji">🏠</div>
                    <div class="label">Home</div>
                    <div class="category-score">⭐ <span id="score-Home">0</span></div>
                    <div class="category-lives" id="lives-Home"></div>
                </button>
                <button class="category-btn" style="background:#ffdd99" onclick="startGame('MyFace')">
                    <div class="emoji">👦</div>
                    <div class="label">My Face</div>
                    <div class="category-score">⭐ <span id="score-MyFace">0</span></div>
                    <div class="category-lives" id="lives-MyFace"></div>
                </button>
                <button class="category-btn" style="background:#ffb6c1" onclick="startGame('Colors')">
                    <div class="emoji">🎨</div>
                    <div class="label">Color</div>
                    <div class="category-score">⭐ <span id="score-Colors">0</span></div>
                    <div class="category-lives" id="lives-Colors"></div>
                </button>
                <button class="category-btn" style="background:#a8dadc" onclick="startGame('MyFriends')">
                    <div class="emoji">🧑‍🤝‍🧑</div>
                    <div class="label">My Friends</div>
                    <div class="category-score">⭐ <span id="score-MyFriends">0</span></div>
                    <div class="category-lives" id="lives-MyFriends"></div>
                </button>
                <button class="category-btn" style="background:#ffcad4" onclick="startGame('Family')">
                    <div class="emoji">👨‍👩‍👧‍👦</div>
                    <div class="label">Family</div>
                    <div class="category-score">⭐ <span id="score-Family">0</span></div>
                    <div class="category-lives" id="lives-Family"></div>
                </button>
                <button class="category-btn" style="background:#d8e2dc" onclick="startGame('School')">
                    <div class="emoji">🏫</div>
                    <div class="label">School</div>
                    <div class="category-score">⭐ <span id="score-School">0</span></div>
                    <div class="category-lives" id="lives-School"></div>
                </button>
                <button class="category-btn" style="background:#b5e2fa" onclick="startGame('Sports')">
                    <div class="emoji">⚽</div>
                    <div class="label">Sports</div>
                    <div class="category-score">⭐ <span id="score-Sports">0</span></div>
                    <div class="category-lives" id="lives-Sports"></div>
                </button>
                <button class="category-btn" style="background:#f7d1cd" onclick="startGame('Hobbies')">
                    <div class="emoji">🎨</div>
                    <div class="label">Hobbies</div>
                    <div class="category-score">⭐ <span id="score-Hobbies">0</span></div>
                    <div class="category-lives" id="lives-Hobbies"></div>
                </button>
                <button class="category-btn" style="background:#e8c1a0" onclick="startGame('Clothes')">
                    <div class="emoji">👕</div>
                    <div class="label">Clothes</div>
                    <div class="category-score">⭐ <span id="score-Clothes">0</span></div>
                    <div class="category-lives" id="lives-Clothes"></div>
                </button>
                <button class="category-btn" style="background:#c1f0fb" onclick="startGame('Toys')">
                    <div class="emoji">🧸</div>
                    <div class="label">Toys</div>
                    <div class="category-score">⭐ <span id="score-Toys">0</span></div>
                    <div class="category-lives" id="lives-Toys"></div>
                </button>
                <button class="category-btn" style="background:#e2ece9" onclick="startGame('Food')">
                    <div class="emoji">🍚</div>
                    <div class="label">Food</div>
                    <div class="category-score">⭐ <span id="score-Food">0</span></div>
                    <div class="category-lives" id="lives-Food"></div>
                </button>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="screen-game" class="screen">
                    <div class="header">
                        <div class="header-left">
                            <button class="btn-home" onclick="goHome()" title="Go Home">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
                                </svg>
                            </button>
                            <div class="category-title" id="game-category-title">Category</div>
                        </div>
                        <div class="timer-box" id="timer-box">
                            ⏱️ <span id="timer-display">60</span>
                        </div>
                        <div class="score-box">
                            ⭐ <span id="score-display">0</span>
                        </div>
                    </div>

                    <div class="timer-bar-container">
                        <div class="timer-bar" id="timer-bar"></div>
                    </div>

                    <div class="lives-container" id="lives-container">
                        <!-- Hearts will be dynamically injected based on difficulty -->
                    </div>

                    <div class="question-container">
                        <div class="word-info">
                            <h1 id="word-display">Word</h1>
                            <div id="ipa-display" class="ipa-badge" onclick="playAudio()">🇺🇸 /wɜːrd/</div>


                        </div>

                        <button class="btn-audio" onclick="playAudio()">🔊</button>
                    </div>

                    <div class="options-grid" id="options-grid">
                        <!-- Options will be injected here -->
                    </div>
                </div>

                <!-- Game Over Screen -->
                <div id="screen-game-over" class="screen">
                    <h1 class="text-white bounce-loop" style="margin-top: 5vh;" id="game-over-title">Game Over!</h1>
                    <div class="final-score-box">
                        <h2 id="final-score-label">Your Score</h2>
                        <h1 id="final-score">0</h1>
                    </div>
                    <button class="btn-primary" onclick="restartGame()">Play Again</button>
                    <button class="btn-secondary" onclick="goHome()">Go Home</button>
                </div>

                <!-- Reward Overlay -->
                <div id="reward-overlay">
                    <div class="star-animation">🌟</div>
                </div>
            </div>

            <script src="game.js"></script>
</body>

</html>
